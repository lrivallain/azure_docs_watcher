[tool.pytest.ini_options]
# The application modules live at the repository root, next to `tests/`.
pythonpath = [".", "tests"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into the module level caches on purpose.
"tests/*" = ["SLF001"]
