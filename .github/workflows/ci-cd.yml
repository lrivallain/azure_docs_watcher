name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Never let two deployments of the same branch race each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Version the Azure App Service is being moved to. Deployment installs the
  # dependencies on the App Service itself, so its runtime is what actually
  # runs this code.
  TARGET_PYTHON_VERSION: '3.13'

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the runtime production still has, 3.13 the one it is moving
        # to. Testing both is what stops code relying on features the running
        # runtime lacks. Drop 3.10 once the App Service has been bumped, and
        # remove the UP017 exception in pyproject.toml with it.
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest

  deploy:
    name: Deploy to Azure
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v7

      # Dependencies are installed on Azure by Oryx, from requirements.txt.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: azdocswatch
          slot-name: Production
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_0259A4419D1548F58B742DA1889C1709 }}
